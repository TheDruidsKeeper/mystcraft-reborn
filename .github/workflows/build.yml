name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: docker/setup-buildx-action@v4

      # Same Dockerfile as the local build; BuildKit layer cache is stored in the GHA cache.
      - name: Build mod jar inside Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          target: export
          outputs: type=local,dest=out
          cache-from: type=gha,scope=mystcraft-build
          cache-to: type=gha,mode=max,scope=mystcraft-build

      - name: List artifacts
        run: ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: mystcraft-reborn-jars
          path: out/*.jar
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: mystcraft-reborn-jars
          path: out
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: out/*.jar
          generate_release_notes: true
