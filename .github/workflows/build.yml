name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.cursor/**'
      - 'scripts/docs/**'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.cursor/**'
      - 'scripts/docs/**'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: docker/setup-buildx-action@v4

      # Same Dockerfile as the local build; BuildKit layer cache is stored in the GHA cache.
      - name: Build mod jar inside Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          target: export
          outputs: type=local,dest=out
          cache-from: type=gha,scope=mystcraft-build
          cache-to: type=gha,mode=max,scope=mystcraft-build

      - name: List artifacts
        run: ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: mystcraft-reborn-jars
          path: out/*.jar
          if-no-files-found: error

  smoke:
    name: Smoke test (dedicated server)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Boots the NeoForge dedicated server with the mod and runs the in-game self check.
      # The stage always exits 0 so the log is exported; the status file decides pass/fail below.
      - name: Boot server with the mod
        uses: docker/build-push-action@v7
        with:
          context: .
          target: smoke-export
          outputs: type=local,dest=out
          build-args: SMOKE_SECONDS=420
          cache-from: type=gha,scope=mystcraft-build
          cache-to: type=gha,mode=max,scope=mystcraft-build

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-log
          path: out/logs/smoke.log
          if-no-files-found: warn

      - name: Check self-check result
        run: |
          result="$(tr -d '[:space:]' < out/smoke-status.txt 2>/dev/null || echo MISSING)"
          echo "self check: $result"
          if [ "$result" != "PASSED" ]; then
            echo "::error::Smoke test failed ($result) - see the smoke-log artifact"
            grep -E "\[selfcheck\]|SELFCHECK" out/logs/smoke.log | tail -40 || true
            exit 1
          fi

  gametest:
    name: In-game tests (GameTest server)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Boots the GameTest server with the mod + the dev-only mystcraft_tests mod and runs every @GameTest.
      - name: Run game tests
        uses: docker/build-push-action@v7
        with:
          context: .
          target: gametest-export
          outputs: type=local,dest=out
          cache-from: type=gha,scope=mystcraft-build
          cache-to: type=gha,mode=max,scope=mystcraft-build

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gametest-log
          path: |
            out/logs/gametest.log
            out/gametest-results
          if-no-files-found: warn

      - name: Check game test result
        run: |
          result="$(tr -d '[:space:]' < out/gametest-status.txt 2>/dev/null || echo MISSING)"
          echo "game tests: $result"
          if [ "$result" != "PASSED" ]; then
            echo "::error::Game tests failed ($result) - see the gametest-log artifact"
            grep -iE "failed|GameTestException" out/logs/gametest.log | tail -40 || true
            exit 1
          fi

  client-smoke:
    name: Client smoke (Xvfb + Mesa)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Headless dev client driven by ClientSelfCheck; exports screenshots for review.
      - name: Run client
        uses: docker/build-push-action@v7
        with:
          context: .
          target: client-smoke-export
          outputs: type=local,dest=out
          build-args: CLIENT_SMOKE_SECONDS=1500
          cache-from: type=gha,scope=mystcraft-build
          cache-to: type=gha,mode=max,scope=mystcraft-build

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: client-smoke
          path: |
            out/logs/client-smoke.log
            out/screenshots
            out/qa-report.txt
          if-no-files-found: warn

      - name: Check client result
        run: |
          result="$(tr -d '[:space:]' < out/client-smoke-status.txt 2>/dev/null || echo MISSING)"
          echo "client smoke: $result"
          if [ "$result" = "PASSED" ]; then
            exit 0
          fi
          if [ "$result" = "VISUAL_DRIFT" ]; then
            echo "::warning::Client smoke visual drift (VISUAL_DRIFT) - review qa-report.txt / screenshots in the client-smoke artifact; update baselines when intentional"
            head -80 out/qa-report.txt 2>/dev/null || true
            exit 0
          fi
          echo "::error::Client smoke failed ($result) - see the client-smoke artifact"
          grep -E "\[clientcheck\]|CLIENT SELFCHECK|Missing textures|Missing FluidModel" out/logs/client-smoke.log | tail -40 || true
          exit 1

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: mystcraft-reborn-jars
          path: out
      - name: Build launcher instance packs
        run: scripts/pack-instance.sh
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            out/*.jar
            out/mystcraft-reborn.mrpack
            out/mystcraft-reborn-multimc.zip
          generate_release_notes: true
