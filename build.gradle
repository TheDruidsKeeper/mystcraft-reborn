plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    // Add additional repositories here if required by dependencies.
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

// Minecraft 26.1 ships Java 25 to end users; mods must target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// In-game tests (NeoForge test framework + vanilla GameTest). Separate source set and mod id so nothing of it
// ships in the mod jar; only the gameTestServer run loads it. scripts/gametest.sh runs it headless in Docker.
sourceSets {
    gametest
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gametest

    // src/main/resources/META-INF/accesstransformer.cfg is auto-detected.
    validateAccessTransformers = true

    runs {
        client {
            client()
            // Pinned so the Docker client smoke test can pre-seed options.txt and collect screenshots.
            gameDirectory = project.file('run/client')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            jvmArgument '-Xmx3G'
        }

        server {
            server()
            programArgument '--nogui'
            // Pinned so the Docker smoke test knows where to write eula.txt / server.properties.
            gameDirectory = project.file('run/server')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', "${project.mod_id},${project.mod_id}_tests"
            systemProperty 'net.neoforged.testframework.sourceFileRoots', project.file('src/gametest/java').toPath().toAbsolutePath().toString()
            gameDirectory = project.file('run/gametest')
            sourceSet = sourceSets.gametest // runtime classpath incl. the test framework mod
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "${mod_id}_tests" {
            sourceSet(sourceSets.gametest)
        }
    }

    // Client / server / data runs load only the real mod; the game-test server also loads the test mod.
    // (Configured after the mods block so the mod models exist.)
    runs.named('client') { loadedMods = [mods."${mod_id}"] }
    runs.named('server') { loadedMods = [mods."${mod_id}"] }
    runs.named('data') { loadedMods = [mods."${mod_id}"] }
    runs.named('gameTestServer') { loadedMods = [mods."${mod_id}", mods."${mod_id}_tests"] }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
        loadedMods = [mods."${mod_id}"] // the gametest mod needs the test framework, which is not on the unit test classpath
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // In-game tests: the test framework is itself a mod; it is only on the gametest source set's classpath, which
    // only the gameTestServer run uses.
    gametestImplementation sourceSets.main.output
    gametestImplementation "net.neoforged:testframework:${project.neo_version}"
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStandardStreams = false
    }
}

// Expand ${...} placeholders in src/main/templates (neoforge.mods.toml).
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Facility datapack: template pools + credits are generated from the piece manifest written by
// scripts/structures/import.py, so adding a room never means hand-editing pool JSON (docs/STRUCTURES.md).
var facilityPackDir = file('src/main/resources/datapacks/mystcraft_facility')
var generateStructurePools = tasks.register('generateStructurePools') {
    var manifestFile = new File(facilityPackDir, 'manifest.json')
    var outDir = file('build/generated/sources/structurePools')
    inputs.file manifestFile
    outputs.dir outDir
    doLast {
        var manifest = new groovy.json.JsonSlurper().parse(manifestFile)
        var ns = manifest.namespace
        var packOut = new File(outDir, 'datapacks/mystcraft_facility')
        var poolDir = new File(packOut, "data/${ns}/worldgen/template_pool")
        outDir.deleteDir()
        poolDir.mkdirs()

        var elementsByPool = [:].withDefault { [] }
        manifest.pieces.each { piece ->
            var poolCfg = manifest.pools[piece.pool] ?: [:]
            var processors = piece.processors ?: poolCfg.processors ?: [processors: []]
            elementsByPool[piece.pool] << [
                    weight : piece.weight ?: 1,
                    element: [
                            element_type: 'minecraft:single_pool_element',
                            location    : "${ns}:${piece.file}".toString(),
                            processors  : processors,
                            projection  : piece.projection ?: 'rigid',
                    ],
            ]
        }
        (manifest.external ?: []).each { ext ->
            var poolCfg = manifest.pools[ext.pool] ?: [:]
            elementsByPool[ext.pool] << [
                    weight : ext.weight ?: 1,
                    element: [
                            element_type: 'minecraft:single_pool_element',
                            location    : ext.location,
                            processors  : ext.processors ?: poolCfg.processors ?: [processors: []],
                            projection  : ext.projection ?: 'rigid',
                    ],
            ]
        }
        manifest.pools.each { poolName, cfg ->
            var pool = [
                    fallback: cfg.fallback ?: 'minecraft:empty',
                    elements: elementsByPool[poolName],
            ]
            var f = new File(poolDir, "${poolName}.json")
            f.parentFile.mkdirs()
            f.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(pool)) + '\n'
        }
        var unknown = elementsByPool.keySet() - manifest.pools.keySet()
        if (!unknown.isEmpty()) throw new GradleException("manifest pieces reference undeclared pools: ${unknown}")

        // Attribution shipped inside the pack.
        var credits = new StringBuilder('# Facility structure credits\n\nPieces imported by scripts/structures/import.py. ')
        credits << 'Each file keeps its upstream license; see the mod NOTICE.md for the full texts.\n\n'
        manifest.pieces.groupBy { it.source.pack }.each { pack, pieces ->
            var s = pieces[0].source
            credits << "## ${pack} — ${s.author} (${s.license}) ${s.url}\n\n"
            pieces.sort { it.file }.each { credits << "- `${it.file}` ← `${it.source.path}`\n" }
            credits << '\n'
        }
        new File(packOut, 'CREDITS.md').text = credits.toString()
        logger.lifecycle("generateStructurePools: ${manifest.pools.size()} pools, ${manifest.pieces.size()} pieces")
    }
}
sourceSets.main.resources.srcDir generateStructurePools
neoForge.ideSyncTask generateStructurePools

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
