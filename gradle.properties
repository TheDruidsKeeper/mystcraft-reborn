# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft / NeoForge (see docs/TOOLCHAIN.md for the version rationale)
# The Minecraft line this build targets; used for the jar name.
minecraft_version=26.1
# NeoForge 26.1.2.x actually runs on Minecraft 26.1.2, so the dependency must accept the whole
# 26.1 line. "[26.1]" means *exactly* 26.1 and makes FML reject the mod with
# "Mod mystcraft requires minecraft 26.1" (expected [26.1,26.1], actual 26.1.2).
minecraft_version_range=[26.1,26.2)
neo_version=26.1.2.104
neo_version_range=[26.1.2.104,)

# Mod
mod_id=mystcraft
mod_name=Mystcraft Reborn
mod_license=LGPL-3.0-or-later
mod_version=0.1.2
mod_group_id=com.tbd.mystcraft
mod_authors=TheDruidsKeeper, original Mystcraft by XCompWiz
mod_description=A from-scratch recreation of Mystcraft for modern Minecraft: write Descriptive Books, link to procedurally generated Ages, and manage their instability.
